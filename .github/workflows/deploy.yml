name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one Pages deployment at a time; let an in-progress deploy finish
# instead of cancelling it halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Installs Vite+ (`vp`). The `vp` version is auto-detected from the
      # `vite-plus` entry in package.json (0.3.0), so it stays in sync with
      # local dev. Pin an exact release tag: the moving `v1` tag is frozen
      # at v1.15.0 and receives no updates.
      - name: Setup Vite+ (vp)
        id: setup-vp
        uses: voidzero-dev/setup-vp@v1.18.0
        with:
          # Vite+ requires Node ^20.19 || ^22.18 || >=24.11
          node-version: "24"
          cache: true
          # Install runs as an explicit step below so we can work around
          # npm's optionalDependencies bug (npm/cli#4828) and skip the
          # `prepare` hook that would fire before the native binding is
          # ready.
          run-install: false

      - name: Install dependencies
        # npm has a known bug (npm/cli#4828) where optionalDependencies —
        # which vite-plus uses to ship per-platform native binaries — are
        # silently skipped when a lockfile is present, even when the entry
        # matches the current platform/cpu/libc. vite-plus's own error
        # message recommends removing the lockfile and retrying.
        # --ignore-scripts skips the `prepare` hook (`vp config`) which
        # loads the native binding and would otherwise crash mid-install.
        run: |
          rm -f package-lock.json
          vp install --ignore-scripts

      - name: Format check
        run: vp run format:check

      - name: Lint
        run: vp run lint

      - name: Type check
        run: vp run typecheck

      - name: i18n key consistency check
        run: vp run check:i18n

      - name: Test
        run: vp test run

      - name: Build
        run: vp run build

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          # Hidden files are skipped by default, which would drop `.nojekyll`
          include-hidden-files: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
